name: tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks - Latest Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          php: '8.5'
          laravel: '13.*'
          testbench: '11.*'
          stability: prefer-stable
          packages: pestphp/pest:^5.0 pestphp/pest-plugin-type-coverage:^5.0.1

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        run: composer test:types

  tests:
    needs: checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: &os [ubuntu-latest, windows-latest]
        php: &php [8.3, 8.4, 8.5]
        laravel: &laravel [12.*, 13.*]
        stability: &stability [prefer-lowest, prefer-stable]
        include: &testbench
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          php: ${{ matrix.php }}
          laravel: ${{ matrix.laravel }}
          testbench: ${{ matrix.testbench }}
          stability: ${{ matrix.stability }}

      - name: PHPStan
        run: composer analyse

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  versioned-storage-tests:
    needs: checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        # Versioned storage requires PCNTL, POSIX, and sockets, which native Windows PHP lacks.
        os: [ubuntu-latest]
        php: *php
        laravel: *laravel
        stability: *stability
        include: *testbench

    name: Versioned Storage - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          php: ${{ matrix.php }}
          laravel: ${{ matrix.laravel }}
          testbench: ${{ matrix.testbench }}
          stability: ${{ matrix.stability }}
          extensions: pcntl, posix, sockets
          # Replace with a released version after the resource-retirement PR is merged.
          packages: skyraptor/laravel-versioned-storage:dev-feat/retire-resource#8480b42495f72d8efaf8b740a7e6ef1d80245e0a

      - name: PHPStan
        run: composer analyse

      - name: Test Suite
        run: >-
          vendor/bin/pest
          tests/Feature/CoalescedSnapshotTest.php
          tests/Feature/CoalescedRecoveryTest.php
          tests/Feature/CoalescedVersionedStorageTest.php
          tests/Feature/JobProgressVersionedStorageTest.php
          --fail-on-skipped

  without-optional-dependencies-tests:
    needs: checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: *os
        php: *php
        laravel: *laravel
        stability: *stability
        include: *testbench

    name: Without Optional Dependencies - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          php: ${{ matrix.php }}
          laravel: ${{ matrix.laravel }}
          testbench: ${{ matrix.testbench }}
          stability: ${{ matrix.stability }}
          composer-flags: --no-dev

      - name: Test Suite
        run: php tests/Smoke/WithoutOptionalDependencies.php vendor/autoload.php
